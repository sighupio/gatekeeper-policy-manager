# Smoke-tests that the deployed GPM serves each view with real data. GPM 2.0 renders the UI on the
# server and dropped the /api/v1 JSON API, so each container fetches an HTML view and greps for a
# string only present once its data is rendered. A view that fails to reach the Kubernetes API still
# returns HTTP 200 with an error banner, so the grep (not the status code) is the real assertion.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-tests
spec:
  template:
    spec:
      containers:
        - name: configurations
          image: docker.io/curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            [
              "curl -s http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local/configurations | grep 'kube-system'",
            ]
        - name: constrainttemplates
          image: docker.io/curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            [
              "curl -s http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local/constrainttemplates | grep 'K8sLivenessProbe'",
            ]
        - name: constraints
          image: docker.io/curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            [
              "curl -s http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local/constraints | grep 'liveness-probe'",
            ]
        - name: mutations
          image: docker.io/curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            [
              "curl -s http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local/mutations | grep 'demo-annotation-owner'",
            ]
        - name: events
          image: docker.io/curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            [
              "curl -s http://gatekeeper-policy-manager.gatekeeper-system.svc.cluster.local/events | grep 'gatekeeper-webhook'",
            ]
      restartPolicy: Never
  backoffLimit: 9
