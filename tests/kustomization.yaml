namespace: gatekeeper-system

resources:
  # Deploy Gatekeeper from KFD OPA Module
  - github.com/sighupio/module-policy/katalog/gatekeeper/core?ref=v1.17.0
  - github.com/sighupio/module-policy/katalog/gatekeeper/rules?ref=v1.17.0
  # katalog/gatekeeper/monitoring is left out on purpose. It adds a ServiceMonitor, a
  # PrometheusRule and a dashboard ConfigMap that no view shows and no test reads, and it
  # made the suite install two Prometheus CRDs from raw.githubusercontent.com first.
  - mutation.yaml

  # Deploy GPM itself
  - ../manifests/rbac.yaml
  - ../manifests/deployment.yaml
  - ../manifests/service.yaml

patches:
  - path: deploy-patch.yaml
  # Turn on admission events so the events view has something to show. Gatekeeper emits none by
  # default, which is why that view went untested. A kustomize patch, not a kubectl patch: kapp owns
  # these objects, and it puts back anything patched outside the fixture on the next deploy.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gatekeeper-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --emit-admission-events=true

  # One constraint per enforcement mode, so the views actually render deny, dryrun and warn instead
  # of a page of identical pills. `add`, not `replace`: the upstream rules may not set the field.
  # unique-ingress-host deliberately stays deny -- the admission-event test needs the webhook to
  # reject something, and liveness-probe stays deny so the report keeps a blocking violation.
  - target:
      group: constraints.gatekeeper.sh
      kind: K8sReadinessProbe
      name: readiness-probe
    patch: |-
      - op: add
        path: /spec/enforcementAction
        value: warn
  - target:
      group: constraints.gatekeeper.sh
      kind: SecurityControls
      name: enforce-deployment-and-pod-security-controls
    patch: |-
      - op: add
        path: /spec/enforcementAction
        value: dryrun

images:
  - name: quay.io/sighup/gatekeeper-policy-manager
    newName: gatekeeper-policy-manager
    newTag: test
