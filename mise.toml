[settings]
experimental = true
# Go's version is not pinned here. mise reads it from go.mod's `toolchain` directive, the single
# source of truth, as an idiomatic version file. Enabled for `go` only, on purpose. The Dockerfile
# still names the version explicitly (trusted base image); the check-go-version task guards the two
# against drift.
idiomatic_version_file_enable_tools = ["go"]

[tools]
golangci-lint = "2.12.2"
# Keep in sync with KIND_VERSION / CLUSTER_VERSION in .drone.yml.
kind = "0.32.0"
kubectl = "1.36.1"
# Pinned to the versions the retired quay.io/sighup/e2e-testing image shipped, so moving
# CI onto mise is a refactor and not a behaviour change. kubectl is the deliberate
# exception: the image carried 1.32.2 against a 1.36 cluster, outside the supported skew.
kustomize = "5.6.0"
helm = "3.12.0"
bats = "1.1.0"
shellcheck = "0.11.0"
"github:google/addlicense" = "v1.1.1"
# Checks the module graph against the Go vulnerability database.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
# For the end-to-end tests (tests/e2e runs Playwright through yarn). node 24 is the current LTS
# line; yarn is v1 to match the committed yarn.lock.
node = "24"
yarn = "1.22.22"
# Formats the TypeScript in tests/e2e.
"npm:prettier" = "3.9.6"

[tasks."lint-shell"]
description = "shellcheck the shell scripts"
run = 'shellcheck $(find . -name "*.sh" -not -path "*/node_modules/*")'

[tasks.lint]
description = "run golangci-lint (and shellcheck via the lint-shell dep)"
# lint-shell runs first, in the same qa step, so a shell-script fault fails CI too.
depends = ["lint-shell"]
run = "golangci-lint run --config=.rules/.golangci.yml ./..."

[tasks."lint-fix"]
description = "run golangci-lint with autofix"
run = "golangci-lint run --fix --config=.rules/.golangci.yml ./..."

[tasks."license-check"]
description = "check license headers"
run = """
addlicense -c "SIGHUP s.r.l" -v -l bsd -check \
  -ignore 'chart/**' \
  -ignore 'static-content/**' \
  -ignore '**/node_modules/**' \
  -ignore 'static/ssr/*.min.js' \
  -ignore 'gpm.yaml' \
  -ignore 'rendered_chart.yaml' \
  .
"""

[tasks."license-add"]
description = "add license headers"
run = """
addlicense -c "SIGHUP s.r.l" -y 2017-present -v -l bsd \
  -ignore 'chart/**' \
  -ignore 'static-content/**' \
  -ignore '**/node_modules/**' \
  -ignore 'static/ssr/*.min.js' \
  -ignore 'gpm.yaml' \
  -ignore 'rendered_chart.yaml' \
  .
"""

[tasks.format]
description = "format the e2e tests with prettier"
run = 'prettier --write "tests/e2e/**/*.{ts,js}"'

[tasks."format:check"]
description = "check the e2e test formatting without changing anything"
run = 'prettier --check "tests/e2e/**/*.{ts,js}"'

[tasks."check-go-version"]
description = "fail if the Dockerfile's Go version drifts from go.mod's toolchain"
# go.mod's `toolchain` is the single source (mise reads it too). The Dockerfile must name the
# version explicitly for its base image, so this guards the two against silent drift.
run = """
gomod=$(sed -n 's/^toolchain go//p' go.mod)
docker=$(sed -n 's/^FROM.*golang:\\([^ ]*\\).*/\\1/p' Dockerfile | head -1)
if [ "$gomod" != "$docker" ]; then
  echo "Go version mismatch: go.mod toolchain=$gomod, Dockerfile=$docker" >&2
  echo "Update the Dockerfile's golang: tag to match go.mod, or vice versa." >&2
  exit 1
fi
echo "Go version aligned across go.mod and Dockerfile: $gomod"
"""

[tasks.vulncheck]
description = "check Go dependencies against the vulnerability database"
# check-go-version first: a passing vulncheck only certifies the artifact if the image builds the
# same Go the scan used.
depends = ["check-go-version"]
# Same node_modules filter as the tests: npm packages vendor Go sources.
run = 'govulncheck $(go list ./... | grep -v /node_modules/)'

[tasks."test:unit:go"]
description = "run the Go unit tests"
# node_modules vendors Go sources (flatted) that `./...` would otherwise pick up.
run = 'go test -count=1 $(go list ./... | grep -v /node_modules/)'

[tasks."test:unit"]
description = "run the unit tests"
depends = ["test:unit:go"]

[tasks."chart-readme"]
description = "regenerate chart/README.md from values.yaml"
# Generated, never hand-edited: the committed copy had drifted to values that no longer existed.
# frigate is not pinned here on purpose. It is a python tool, needed once per release, and pinning
# it through the pipx backend makes `mise install` fail wherever uv is missing. Install it with
# `uvx --from frigate frigate` or `pipx install frigate`.
run = "cd chart && frigate gen . > README.md"

[tasks.render]
description = "render the manifests and the chart for the deprecated-API check"
run = [
  "kustomize build . > gpm.yaml",
  "helm template --set config.secretKey=e2e chart > rendered_chart.yaml",
]

[tasks.e2e]
description = "run the bats e2e suite; expects KUBECONFIG and LOAD_IMAGE to be set"
run = """
(cd tests && kustomize edit set image quay.io/sighup/gatekeeper-policy-manager="$LOAD_IMAGE")
bats -t tests/tests.sh
"""
