[bumpversion]
commit = True
tag = True
sign_tags = True
tag_name = v{new_version}
current_version = 2.0.0-rc.1
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-(?P<stage>rc)\.(?P<rc>\d+))?
serialize = 
	{major}.{minor}.{patch}-{stage}.{rc}
	{major}.{minor}.{patch}

# Model the pre-release as a named "stage" (rc | ga) rather than a bare optional -rc.N. Because
# stage=rc is a non-default value, bumpversion always uses the long serialize form -- even at rc.0 --
# so current_version serializes fully and can never partial-match a bare "X.Y.Z" and double the
# suffix (the bug that produced v2.0.0-rc.1-rc.0). Bump the rc number with `bumpversion rc`; cut the
# final release with `bumpversion stage` (rc -> ga, which drops the suffix).
[bumpversion:part:stage]
optional_value = ga
first_value = rc
values =
	rc
	ga

[bumpversion:file:README.md]

[bumpversion:file:kustomization.yaml]

[bumpversion:file:chart/Chart.yaml]

[bumpversion:file:chart/values.yaml]

[bumpversion:file:main.go]
