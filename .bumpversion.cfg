[bumpversion]
commit = True
tag = True
sign_tags = True
tag_name = v{new_version}
current_version = 2.0.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-(?P<stage>rc)\.(?P<rc>\d+))?
serialize = 
	{major}.{minor}.{patch}-{stage}.{rc}
	{major}.{minor}.{patch}

[bumpversion:part:stage]
optional_value = ga
first_value = rc
values = 
	rc
	ga

[bumpversion:file:README.md]

[bumpversion:file:kustomization.yaml]

[bumpversion:file:chart/Chart.yaml]

[bumpversion:file:chart/values.yaml]

# Generated by `mise run chart-readme`, but it quotes the app version as the image.tag default,
# so it goes stale in the tagged commit unless the bump rewrites it too. The chart's own version on
# line 1 is not the app version: regenerate the file when you bump the chart.
[bumpversion:file:chart/README.md]

[bumpversion:file:main.go]
