[bumpversion]
commit = True
tag = True
# Project tags are v-prefixed (v2.0.0-rc.0, v1.1.2, ...); the version strings in the files are not,
# so keep the 'v' only on the tag. Without this, bumpversion's default tag would drop the 'v'.
tag_name = v{new_version}
current_version = 2.0.0-rc.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-rc\.(?P<rc>\d+))?
serialize =
	{major}.{minor}.{patch}-rc.{rc}
	{major}.{minor}.{patch}

[bumpversion:file:README.md]

[bumpversion:file:kustomization.yaml]

[bumpversion:file:chart/Chart.yaml]

[bumpversion:file:chart/values.yaml]

# The version GPM logs at startup. Without this every bump left it lying.
[bumpversion:file:main.go]
