version: "2"

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) are a deliberate
  # starting point — govet already covers `go vet`, so there is no separate vet step.
  exclusions:
    paths:
      # npm packages vendor Go sources (e.g. flatted/golang); they belong to no module
      # of ours but `./...` picks them up once `yarn install` has run locally.
      - tests/e2e/node_modules
