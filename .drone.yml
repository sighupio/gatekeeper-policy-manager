name: license
kind: pipeline
type: docker

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: check
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      # Authenticate mise's GitHub API calls (tool resolution/downloads) to avoid the
      # 60 req/h unauthenticated rate limit.
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      # Serialize concurrent `mise install` across pipelines sharing the host cache.
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run license-check

trigger:
  ref:
    exclude:
      - refs/tags/gatekeeper-policy-manager-*

---
name: qa
kind: pipeline
type: docker

depends_on:
  - license

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  - name: lint
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run lint

  - name: vulncheck
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run vulncheck

  - name: format-check
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run format:check

  - name: unit-tests-go
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run test:unit:go

  - name: render
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    depends_on:
      - clone
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run render

  - name: check-deprecated-apis
    image: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5
    pull: always
    depends_on:
      - render
    commands:
      # we use --ignore-deprecations because we don't want the CI to fail when the API has not been removed yet.
      # Keep the target version in sync with CLUSTER_VERSION in the e2e pipeline.
      - /pluto detect gpm.yaml --ignore-deprecations --target-versions=k8s=v1.36.0
      - /pluto detect rendered_chart.yaml --ignore-deprecations --target-versions=k8s=v1.36.0

trigger:
  ref:
    exclude:
      - refs/tags/gatekeeper-policy-manager-*

---
name: build
kind: pipeline
type: docker

depends_on:
  - qa

trigger:
  ref:
    include:
      - refs/tags/**
      - refs/heads/**
    exclude:
      - refs/tags/gatekeeper-policy-manager-*

steps:
  # On Dependabot branches, refresh the vendored Alpine to the version package.json now pins, before
  # the image is built. This runs in the same shared workspace as the build step below, so the image
  # (and the e2e that runs it) tests the bumped Alpine instead of the committed one. Skipped on every
  # other branch, where the committed file already matches (check-alpine-version guards that).
  - name: vendor-alpine
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - mise run vendor-alpine
    when:
      ref:
        include:
          - refs/heads/dependabot/**

  - name: build
    image: docker:dind
    pull: always
    environment:
      CONTAINER_IMAGE_NAME: gatekeeper-policy-manager
      CONTAINER_IMAGE_TAG: test-${DRONE_BUILD_NUMBER}
      DOCKERFILE: Dockerfile
      BUILD_CONTEXT: "."
    volumes:
      - name: dockerconfig
        path: /root/.docker/config.json
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - "apk add git"
      - "docker buildx create --name sighup-builder --use"
      - "docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --pull -f $${DOCKERFILE} -t $${CONTAINER_IMAGE_NAME}:$${CONTAINER_IMAGE_TAG} $${BUILD_CONTEXT}"
      - "docker buildx build --load --platform linux/amd64 -t $${CONTAINER_IMAGE_NAME}:$${CONTAINER_IMAGE_TAG} $${BUILD_CONTEXT}"

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir
  - name: dockerconfig
    host:
      path: /root/.docker/config.json
  - name: dockersock
    host:
      path: /var/run/docker.sock

---
name: e2e
kind: pipeline
type: docker

depends_on:
  - build

trigger:
  ref:
    include:
      - refs/tags/**
      - refs/heads/main
      - refs/heads/dependabot/**
    exclude:
      - refs/tags/gatekeeper-policy-manager-*

steps:
  - name: kind
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
      # kind and kubectl versions come from mise.toml — keep CLUSTER_VERSION in sync
      # with the kubectl pin there and with the pluto target in the qa pipeline.
      CLUSTER_VERSION: v1.36.1
      LOAD_IMAGE: gatekeeper-policy-manager:test-${DRONE_BUILD_NUMBER}
      CLUSTER_NAME: ${DRONE_REPO_NAME}-${DRONE_BUILD_NUMBER}
    volumes:
      - name: dockerconfig
        path: /root/.docker/config.json
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - kind create cluster --name $${CLUSTER_NAME} --image registry.sighup.io/fury/kindest/node:$${CLUSTER_VERSION}
      - kind load docker-image $${LOAD_IMAGE} --name $${CLUSTER_NAME}
      - kind get kubeconfig --name $${CLUSTER_NAME} > kubeconfig.yml

  - name: tests
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
      LOAD_IMAGE: gatekeeper-policy-manager:test-${DRONE_BUILD_NUMBER}
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - export KUBECONFIG=$PWD/kubeconfig.yml
      - mise run e2e

  - name: gpm-port-forward
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    detach: true
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - export KUBECONFIG=$PWD/kubeconfig.yml
      # Derive the local port from the build number rather than hardcoding 8080: it avoids
      # collisions between concurrent builds, and ui-tests derives the same number rather than
      # having to learn it from this step. DRONE_BUILD_NUMBER is injected into every step.
      - PORT=$((20000 + DRONE_BUILD_NUMBER % 20000))
      - echo "forwarding 127.0.0.1:$PORT to the gatekeeper-policy-manager service"
      - kubectl port-forward svc/gatekeeper-policy-manager $PORT:80 -n gatekeeper-system

  - name: ui-tests
    image: mcr.microsoft.com/playwright:v1.55.1
    pull: always
    network_mode: host
    commands:
      # gpm-port-forward is detached, so Drone starts this step straight away. Wait for the tunnel
      # to start answering before handing over to Playwright.
      # `depends_on` cannot express this: a detached step never reports completion.
      - |
        PORT=$((20000 + DRONE_BUILD_NUMBER % 20000))
        echo "waiting for GPM on 127.0.0.1:$PORT"
        READY=no
        for i in $(seq 1 90); do
          if curl -sf -o /dev/null "http://127.0.0.1:$PORT/health"; then
            READY=yes
            echo "GPM answered after $i attempt(s)"
            break
          fi
          if [ $((i % 15)) -eq 0 ]; then
            echo "still waiting ($i/90)"
          fi
          sleep 1
        done
        if [ "$READY" != "yes" ]; then
          echo "GPM never answered on 127.0.0.1:$PORT after 90s."
          echo "See the gpm-port-forward step log for what kubectl reported."
          exit 1
        fi
        export GPM_BASE_URL="http://127.0.0.1:$PORT"
        cd tests/e2e && yarn install && yarn test

  - name: echo-diff-images
    image: mcr.microsoft.com/playwright:v1.55.1
    commands:
      - for f in tests/e2e/test-results/*/*diff.png; do echo $f; base64 -w 0 $f; echo; done;
      - "echo 'Use base64 to decode the images and see the diff'"
    when:
      status:
        - failure

  - name: kind-destroy
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
      CLUSTER_NAME: ${DRONE_REPO_NAME}-${DRONE_BUILD_NUMBER}
    volumes:
      - name: dockerconfig
        path: /root/.docker/config.json
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - kind delete cluster --name $${CLUSTER_NAME}
      - rm kubeconfig.yml
    when:
      status:
        - success
        - failure

volumes:
  - name: dockerconfig
    host:
      path: /root/.docker/config.json
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: mise-cache
    host:
      path: /root/mise_data_dir

---
name: release
kind: pipeline
type: docker

depends_on:
  - license
  # - policeman
  - e2e

trigger:
  ref:
    include:
      - refs/tags/**
      - refs/heads/**
    exclude:
      - refs/heads/dependabot/**
      - refs/tags/gatekeeper-policy-manager-*
    # Every push on any branch republishes the `unstable`, `go` and commit-SHA tags. That is
    # deliberate: those tags exist for testing and `unstable` is meant to move. `latest` and the
    # version tag only move on a tag, see the registry-tag step below.
    # An exclusion for this branch used to sit here, misspelled `featuer/go-backend`, so it never
    # matched anything. Removed rather than corrected, since the tags turned out to be wanted.

steps:
  - name: prepare-tar-gz
    image: alpine:latest
    pull: always
    depends_on: [clone]
    commands:
      - tar -zcvf gatekeeper-policy-manager-${DRONE_TAG}.tar.gz manifests/ kustomization.yaml LICENSE README.md
    when:
      ref:
        include:
          - refs/tags/**

  - name: prepare-release-notes
    image: quay.io/sighup/fury-release-notes-plugin:3.7_2.8.4
    pull: always
    depends_on: [clone]
    settings:
      release_notes_file_path: release-notes.md
    when:
      ref:
        include:
          - refs/tags/**
        exclude:
          - refs/tags/gatekeeper-policy-manager-* # Exclude helm chart releases

  - name: registry-unstable
    image: docker:dind
    pull: always
    depends_on: [clone]
    environment:
      username:
        from_secret: quay_username
      password:
        from_secret: quay_password
      registry: quay.io
      repo: quay.io/sighup/gatekeeper-policy-manager
      container_image_name: gatekeeper-policy-manager
      container_image_tag: test-${DRONE_BUILD_NUMBER}
      DOCKERFILE: Dockerfile
      BUILD_CONTEXT: "."
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - "apk add git"
      - "docker login $${registry} -u $${username} -p $${password}"
      - "docker buildx create --name sighup-builder --use"
      - "docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --pull --push -f $${DOCKERFILE} -t $${repo}:unstable -t $${repo}:go -t $${repo}:${DRONE_COMMIT_SHA} $${BUILD_CONTEXT}"
    when:
      event:
        - push

  - name: registry-tag
    image: docker:dind
    pull: always
    depends_on: [clone]
    environment:
      username:
        from_secret: quay_username
      password:
        from_secret: quay_password
      registry: quay.io
      repo: quay.io/sighup/gatekeeper-policy-manager
      container_image_name: gatekeeper-policy-manager
      container_image_tag: test-${DRONE_BUILD_NUMBER}
      DOCKERFILE: Dockerfile
      BUILD_CONTEXT: "."
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - "apk add git"
      - "docker login $${registry} -u $${username} -p $${password}"
      - "docker buildx create --name sighup-builder --use"
      # :latest tracks stable releases only. A release candidate (v*-rc*) gets its version tag but
      # must not move :latest, so users pulling :latest never land on a candidate.
      - 'IMAGE_TAGS="-t $${repo}:${DRONE_TAG}"'
      - 'case "${DRONE_TAG}" in *-rc*) echo "release candidate ${DRONE_TAG}: leaving :latest unchanged" ;; *) IMAGE_TAGS="$${IMAGE_TAGS} -t $${repo}:latest" ;; esac'
      - "docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --pull --push -f $${DOCKERFILE} $${IMAGE_TAGS} $${BUILD_CONTEXT}"
    when:
      event:
        - tag

  - name: publish-prerelease
    image: plugins/github-release
    pull: always
    depends_on:
      - prepare-tar-gz
      - prepare-release-notes
      - registry-tag
    settings:
      api_key:
        from_secret: c3p0
      file_exists: overwrite
      files:
        - gatekeeper-policy-manager-${DRONE_TAG}.tar.gz
      prerelease: true
      overwrite: true
      title: "Release Candidate ${DRONE_TAG}"
      note: release-notes.md
      checksum:
        - md5
        - sha256
    when:
      ref:
        include:
          - refs/tags/v**-rc**

  - name: publish-stable
    image: plugins/github-release
    pull: always
    depends_on:
      - prepare-tar-gz
      - prepare-release-notes
      - registry-tag
    settings:
      api_key:
        from_secret: c3p0
      file_exists: overwrite
      files:
        - gatekeeper-policy-manager-${DRONE_TAG}.tar.gz
      prerelease: false
      overwrite: true
      title: "Release ${DRONE_TAG}"
      note: release-notes.md
      checksum:
        - md5
        - sha256
    when:
      ref:
        exclude:
          - refs/tags/v**-rc**
        include:
          - refs/tags/v**

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

---
name: release-helm-chart
kind: pipeline
type: docker

depends_on:
  - "release"

trigger:
  ref:
    include:
      # Trigger the Helm Chart Releaser only when tagging
      - refs/tags/**
    exclude:
      # Don't publish a chart from a release candidate.
      - refs/tags/v**-rc**

volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir

steps:
  # From v2.0.0 the chart is distributed as an OCI artifact next to the container image on quay.io,
  # not through the gh-pages Helm repo. Consumers install it with
  # `helm install ... oci://quay.io/sighup/charts/gatekeeper-policy-manager --version <chart>`.
  # Helm (with OCI support) is pinned in mise.toml, so its version matches the render and e2e steps.
  # NOTE: quay creates a new repository as private on first push; set
  # quay.io/sighup/charts/gatekeeper-policy-manager to public once, or pulls need authentication.
  - name: publish-chart-oci
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      MISE_GITHUB_TOKEN:
        from_secret: github_token
      QUAY_USERNAME:
        from_secret: quay_username
      QUAY_PASSWORD:
        from_secret: quay_password
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - "(flock -w 1800 9 || exit 1; mise install) 9>/mise-data/.mise-install.lock"
      - eval "$(mise activate bash --shims)"
      - helm registry login quay.io -u "$QUAY_USERNAME" -p "$QUAY_PASSWORD"
      - helm package ./chart --destination /tmp
      - helm push /tmp/gatekeeper-policy-manager-*.tgz oci://quay.io/sighup/charts
