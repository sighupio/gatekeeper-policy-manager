apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatekeeper-policy-manager.fullname" . }}
  labels:
    {{- include "gatekeeper-policy-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gatekeeper-policy-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gatekeeper-policy-manager.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gatekeeper-policy-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          env:
            - name: GPM_LOG_LEVEL
              value: {{ .Values.config.logLevel | upper | quote }}
            - name: GPM_PREFERRED_URL_SCHEME
              value: {{ required "A valid .Values.config.preferredURLScheme entry required! Choose either http or https" .Values.config.preferredURLScheme | quote }}
            {{- if .Values.config.secretKey }}
            - name: GPM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatekeeper-policy-manager.fullname" . }}
                  key: secretKey
            {{- else if .Values.config.secretRef }}
            - name: GPM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretRef }}
                  key: secretKey
            {{- end }}
            {{- if .Values.config.oidc.enabled }}
            {{- /*
              GPM refuses to start with the 1.x default secret key, because it is published in the
              source tree and anyone could forge a session cookie with it. Fail at template time
              with something readable rather than at pod start.
            */}}
            {{- if not (or .Values.config.secretKey .Values.config.secretRef) }}
            {{- fail "config.oidc.enabled requires a session signing key: set config.secretKey, or config.secretRef to the name of an existing secret containing a secretKey field" }}
            {{- end }}
            - name: GPM_AUTH_ENABLED
              value: "OIDC"
            - name: GPM_OIDC_REDIRECT_DOMAIN
              value: {{ .Values.config.oidc.redirectDomain | quote }}
            - name: GPM_OIDC_CLIENT_ID
              value: {{ .Values.config.oidc.clientID | quote }}
            {{- if .Values.config.oidc.clientSecret }}
            - name: GPM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatekeeper-policy-manager.fullname" . }}-oidc
                  key: clientSecret
            {{- end }}
            {{- if .Values.config.oidc.issuer }}
            - name: GPM_OIDC_ISSUER
              value: {{ .Values.config.oidc.issuer | quote }}
            {{- end }}
            {{- /*
              Each endpoint is emitted only when set. Setting any of them turns provider discovery
              off, so sending them as empty strings would be indistinguishable from configuring
              them by hand.
            */}}
            {{- if .Values.config.oidc.authorizationEndpoint }}
            - name: GPM_OIDC_AUTHORIZATION_ENDPOINT
              value: {{ .Values.config.oidc.authorizationEndpoint | quote }}
            {{- end }}
            {{- if .Values.config.oidc.jwksURI }}
            - name: GPM_OIDC_JWKS_URI
              value: {{ .Values.config.oidc.jwksURI | quote }}
            {{- end }}
            {{- if .Values.config.oidc.tokenEndpoint }}
            - name: GPM_OIDC_TOKEN_ENDPOINT
              value: {{ .Values.config.oidc.tokenEndpoint | quote }}
            {{- end }}
            {{- if .Values.config.oidc.introspectionEndpoint }}
            - name: GPM_OIDC_INTROSPECTION_ENDPOINT
              value: {{ .Values.config.oidc.introspectionEndpoint | quote }}
            {{- end }}
            {{- if .Values.config.oidc.userinfoEndpoint }}
            - name: GPM_OIDC_USERINFO_ENDPOINT
              value: {{ .Values.config.oidc.userinfoEndpoint | quote }}
            {{- end }}
            {{- if .Values.config.oidc.endSessionEndpoint }}
            - name: GPM_OIDC_END_SESSION_ENDPOINT
              value: {{ .Values.config.oidc.endSessionEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnvs }}
            {{ toYaml .Values.extraEnvs | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.config.multiCluster.enabled }}
          volumeMounts:
            - mountPath: /home/nonroot/.kube/config
              name: kubeconfig
              subPath: kubeconfig
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ include "gatekeeper-policy-manager.fullname" . }}-multicluster
          {{- end -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
